<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Juegos Gira Mirage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna para celular (máx 540px); el panel de organizadores se abre a 1120px.
   Identidad Refrielectric (azul cielo + azul marino del logo) sobre fondo claro; Mirage aparece como invitado. */
:root{
  --bg:#edf4fa; --surface:#ffffff; --surface2:#f4f8fc; --line:#d5e2ee;
  --ink:#0f2552; --muted:#5a6f88;
  --navy:#16337a; --navy2:#0d2259; --cyan:#3fb4dc; --cyan2:#1b91be; --sky:#e3f4fb;
  --mred:#e2262b; --ok:#139260; --okbg:#e3f6ee; --warn:#b97800; --warnbg:#fdf3dc; --bad:#d0362c; --badbg:#fde9e7;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);
  background-image:radial-gradient(circle at 1px 1px,rgba(63,180,220,.22) 1.2px,transparent 0);background-size:18px 18px;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
a{color:var(--cyan2)}
.wrap{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:12px 48px;display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:1120px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em;color:var(--navy2)}
.eyebrow{font:700 13px/1 var(--f-display);letter-spacing:.28em;text-transform:uppercase;color:var(--cyan2)}
.muted{color:var(--muted)}
.small{font-size:13px}
.ptitle{font-size:36px;text-transform:uppercase;line-height:1}

/* Barra superior */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:4px}
.logo-r{height:auto;width:min(210px,100%);max-height:24px;object-fit:contain;object-position:left center;display:block;min-width:0}
.guest{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 8px;flex:none}
.guest span{font:700 9px/1.05 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.guest img{height:15px;width:auto;display:block}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none;color:var(--navy);font-weight:700;font-size:14px;flex:none}
.iconbtn:focus-visible,.btn:focus-visible,.tile:focus-visible,.gcard:focus-visible,.opt:focus-visible,.step:focus-visible,.pc:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.modepill{font:700 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.modepill.demo{color:var(--warn);border-color:#f0d49a;background:var(--warnbg)}
.demobar{font-size:12px;font-weight:700;color:var(--warn);background:var(--warnbg);border:1px solid #f0d49a;border-radius:10px;padding:6px 10px;text-align:center;margin-top:-8px}
.modepill.on{color:var(--ok);border-color:#a6dcc4;background:var(--okbg)}

/* Portada */
.hero{background:linear-gradient(140deg,var(--navy2) 0%,var(--navy) 55%,#1d4f9e 100%);color:#fff;border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 1px 1px,rgba(63,180,220,.55) 1.5px,transparent 0) 0 0/11px 11px;opacity:.7}
.hero .dash{display:flex;align-items:center;gap:10px;color:#8fd6f2}
.hero .dash::before,.hero .dash::after{content:"";height:2px;width:18px;background:#fff}
.hero h1{font-size:clamp(32px,9vw,50px);line-height:.95;font-weight:800;text-transform:uppercase;color:#fff}
.hero h1 em{font-style:normal;color:var(--cyan)}
.hero .tema{font:600 14px/1.3 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#d8f1fb;border-left:3px solid var(--cyan);padding:4px 0 4px 10px;margin-top:4px;position:relative;z-index:1}
.hero-logos{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 14px;align-self:flex-start;position:relative;z-index:1;flex-wrap:wrap}
.hero-logos .logo-r{width:190px;max-height:22px}
.hero-logos .sep{width:1px;height:22px;background:var(--line)}
.hero-logos .inv{display:flex;align-items:center;gap:6px;font:700 9px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero-logos .inv img{height:16px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .08s ease,filter .15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.btn-main{background:var(--navy);color:#fff;box-shadow:0 5px 0 var(--navy2)}
.btn-cyan{background:var(--cyan2);color:#fff;box-shadow:0 5px 0 #136f93}
.btn-ghost{background:var(--surface);color:var(--navy);border:1px solid var(--line)}
.btn-ok{background:var(--ok);color:#fff;box-shadow:0 5px 0 #0c6643}
.btn-warn{background:#e9a21c;color:#2a1a00;box-shadow:0 5px 0 #a8710c}
.btn-xl{font:800 26px/1 var(--f-display);letter-spacing:.06em;padding:18px;text-transform:uppercase;width:100%}
.btn-sm{padding:8px 12px;border-radius:10px;font-size:14px}
.btn-danger{background:var(--bad);color:#fff;box-shadow:0 4px 0 #8e2119}
.btn.del{color:var(--bad);border-color:#f3c0bb;padding:6px 10px}
.btn.del.sure{background:var(--bad);color:#fff;border-color:var(--bad)}
.dz{border-color:#f3c0bb;background:#fffafa}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Sedes */
.tiles{display:grid;gap:12px}
.tile{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 14px;padding:18px 20px;border-radius:20px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}
.tile h2{font-size:38px;line-height:1;text-transform:uppercase;font-weight:800}
.tile .k{font:700 12px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tile .go{grid-row:1/span 3;grid-column:2;width:48px;height:48px;border-radius:50%;background:var(--cyan2);color:#fff;display:grid;place-items:center;font-size:24px}
.tile .f{color:var(--cyan2);font-weight:700}

/* Formularios */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px;color:var(--navy)}
.field input{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:17px;width:100%}
.field input:focus{outline:2px solid var(--cyan);border-color:transparent}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--navy)}
.err{color:var(--bad);font-size:14px;font-weight:700}

/* Menú de juegos por marca */
.grp{display:flex;flex-direction:column;gap:10px}
.grp-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:6px;border-bottom:2px solid var(--navy)}
.grp.mirage .grp-h{border-color:var(--mred)}
.grp-h h2{font-size:21px;text-transform:uppercase}
.grp-h img{height:auto;width:130px;max-width:45%}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.topics span{font-size:12px;font-weight:700;color:var(--navy);background:var(--sky);border-radius:99px;padding:5px 10px}
.gcard{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.gcard .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--sky)}
.grp.mirage .gcard .ic{background:#fdeceb}
.gcard .ic svg{width:28px;height:28px}
.gcard .body{display:flex;flex-direction:column;gap:5px;min-width:0}
.gcard h3{font-size:24px;text-transform:uppercase;line-height:1}
.gcard .when{font:700 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan2)}
.chip{align-self:flex-start;font:700 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.espera{background:var(--warnbg);color:var(--warn);border-color:#f0d49a}
.chip.jugando{background:var(--okbg);color:var(--ok);border-color:#a6dcc4}
.chip.terminado{background:var(--badbg);color:var(--bad);border-color:#f3c0bb}
.chip.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}

/* Sala de espera */
.lobby{display:flex;flex-direction:column;gap:16px;align-items:stretch;text-align:center}
.radar{width:120px;height:120px;margin:6px auto 0;border-radius:50%;position:relative;display:grid;place-items:center;background:var(--navy);color:#fff}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--cyan);animation:ring 2.2s infinite ease-out;opacity:0}
.radar::after{animation-delay:1.1s}
.radar b{font:800 40px/1 var(--f-display)}
@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.55);opacity:0}}
.players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pchip{background:var(--surface);border:1px solid var(--line);padding:8px 12px;border-radius:99px;font-weight:700;font-size:15px;color:var(--navy);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.me{background:var(--cyan2);border-color:var(--cyan2);color:#fff}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.bigmsg{font:800 30px/1.05 var(--f-display);text-transform:uppercase;color:var(--navy2)}
.banner{border-radius:14px;padding:14px;font-weight:600;text-align:center}
.banner.info{background:var(--sky);color:var(--navy);border:1px solid #bfe5f4}

/* Cuenta regresiva */
.count{position:fixed;inset:0;background:rgba(13,34,89,.95);display:grid;place-items:center;z-index:50}
.count b{font:800 min(40vw,220px)/1 var(--f-display);color:var(--cyan);animation:zoom .9s ease-out both}
@keyframes zoom{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}

/* Quiz y Verdadero/Falso */
.qtop{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:10px}
.qtop .n{font:800 20px/1 var(--f-display);letter-spacing:.06em;color:var(--navy)}
.ttag{font:700 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mred);background:#fdeceb;border-radius:99px;padding:5px 10px;align-self:flex-start}
.timer{height:10px;border-radius:99px;background:#d9e6f1;overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--navy));transform-origin:left;transition:transform .1s linear}
.timer.low i{background:var(--bad)}
.qtext{font:700 25px/1.15 var(--f-display);background:var(--navy);color:#fff;border-radius:18px;padding:18px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;text-align:left;border:0;border-radius:14px;padding:12px;color:#fff;font-weight:700;font-size:17px;cursor:pointer;line-height:1.2;min-height:62px}
.opt b{width:40px;height:40px;border-radius:10px;background:rgba(0,0,0,.2);display:grid;place-items:center;font:800 22px/1 var(--f-display)}
.opt.c0{background:#d8392f;box-shadow:0 5px 0 #8f2119}.opt.c1{background:#1b7fcf;box-shadow:0 5px 0 #11558d}.opt.c2{background:#d18a12;box-shadow:0 5px 0 #8a5a0a}.opt.c3{background:#1f9a67;box-shadow:0 5px 0 #136443}
.vfopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vfopts .opt{grid-template-columns:1fr;text-align:center;justify-items:center;min-height:110px;font:800 30px/1 var(--f-display);text-transform:uppercase}
.fb{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--okbg);border:1px solid #a6dcc4}
.fb.bad{background:var(--badbg);border:1px solid #f3c0bb}
.fb h3{font-size:30px;text-transform:uppercase}
.score{font:800 56px/1 var(--f-display);color:var(--cyan2)}

/* Ordena el proceso */
.slots{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.slot{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;min-height:46px;border-radius:12px;border:2px dashed var(--line);padding:6px 10px;font-weight:700;color:var(--muted)}
.slot b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font:800 18px/1 var(--f-display);color:var(--muted)}
.slot.full{border-style:solid;border-color:#a6dcc4;background:var(--okbg);color:var(--ink);animation:pop .3s both}
.slot.full b{background:var(--ok);color:#fff}
.steps{display:grid;gap:8px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;text-align:left;font-weight:700;font-size:16px;cursor:pointer;color:var(--navy);box-shadow:0 3px 0 var(--line);line-height:1.25}
.step.no{animation:shake .35s;border-color:var(--bad);background:var(--badbg)}

/* Parejas */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc{display:block;width:100%;aspect-ratio:3/3.3;max-width:100%;perspective:600px;border:0;padding:0;background:none;cursor:pointer}
.pc .in{display:block;position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.pc.open .in,.pc.done .in{transform:rotateY(180deg)}
.pc .fa,.pc .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:grid;place-items:center;padding:8px;text-align:center}
.pc .bk{background:linear-gradient(135deg,var(--navy),var(--navy2));border:2px solid var(--cyan)}
.pc .bk::before{content:"";position:absolute;inset:8px;border-radius:10px;background:radial-gradient(circle at 1px 1px,rgba(63,180,220,.5) 1.3px,transparent 0) 0 0/9px 9px}
.pc .bk i{font:800 30px/1 var(--f-display);color:var(--cyan);font-style:normal;position:relative}
.pc .fa{transform:rotateY(180deg);font:700 clamp(12px,3.4vw,16px)/1.12 var(--f-display);text-transform:uppercase}
.pc .fa.c{background:#fff;color:var(--navy2);border:2px solid var(--line)}
.pc .fa.d{background:var(--cyan2);color:#fff;font-family:var(--f-body);text-transform:none;font-weight:700;font-size:clamp(11px,3vw,14px)}
.pc.done .fa{box-shadow:inset 0 0 0 3px var(--ok)}
.pstats{display:flex;justify-content:space-between;font:800 20px/1 var(--f-display);letter-spacing:.04em;color:var(--navy);gap:8px}

/* Lluvia de productos */
.stage{position:relative;width:100%;height:min(68vh,560px);min-height:380px;border-radius:20px;overflow:hidden;border:2px solid var(--navy);
  background:linear-gradient(180deg,#1d4f9e 0%,#16337a 55%,#0d2259 100%);touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(150,215,245,.22) 1.3px,transparent 0) 0 0/16px 16px;pointer-events:none}
.stage canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.aover{position:absolute;inset:0;background:rgba(13,34,89,.92);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:18px;overflow-y:auto}
.aover .bigmsg{color:#fff}
.aover .score{color:var(--cyan)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;width:100%;max-width:380px;text-align:left}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.15;min-width:0}
.lg canvas{width:36px;height:36px;flex:none}
.lg b{color:#7be0b4}
.hearts{color:var(--bad);letter-spacing:.1em}

/* Panel de organizadores */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:99px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button.on{background:var(--cyan2);color:#fff;border-color:var(--cyan2)}
.agrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:900px){.agrid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.stat b{display:block;font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--navy2)}
.stat span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
tr:last-child td{border-bottom:0}
tr.win td{background:var(--okbg)}
.winner{background:linear-gradient(135deg,var(--navy),#1d4f9e);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:4px}
.winner .k{font:700 12px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:#8fd6f2}
.winner .n{font:800 34px/1 var(--f-display);text-transform:uppercase;word-break:break-word}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;white-space:normal}
.ok-t{color:var(--ok);font-weight:700}
.reel{background:var(--surface2);border:1px solid var(--line);color:var(--navy2);border-radius:20px;min-height:150px;display:grid;place-items:center;text-align:center;padding:18px}
.reel b{font:800 clamp(30px,6vw,54px)/1 var(--f-display);text-transform:uppercase;word-break:break-word}
.reel.done{background:linear-gradient(135deg,var(--navy),#1d4f9e);color:#fff;border-color:var(--navy)}
.modal{position:fixed;inset:0;background:rgba(13,34,89,.88);display:grid;place-items:center;z-index:60;padding:16px}
.modal .box{background:#fff;color:var(--ink);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;max-width:420px;width:100%}
.modal .box h2{font-size:34px;text-transform:uppercase}
#qr img,#qr canvas{max-width:100%;height:auto}
.url{font:600 14px/1.3 ui-monospace,Menlo,monospace;word-break:break-all;background:var(--surface2);padding:8px 10px;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy2);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:70;max-width:calc(100% - 32px);text-align:center}
.foot{text-align:center;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}

const splitP = p => String(p).split("/").filter(Boolean);
function makeLocalStore(){
  const KEY = "mirage-juegos-demo";
  let data = {};
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){ return data; } };
  data = read();
  const subs = new Set();
  let bc = null; try { bc = new BroadcastChannel(KEY); } catch(e){}
  const getAt = parts => { let o = data; for (const k of parts){ if (o == null || typeof o !== "object") return null; o = o[k]; } return o === undefined ? null : o; };
  const setAt = (parts, val) => {
    if (!parts.length){ data = val || {}; return; }
    let o = data;
    for (let i = 0; i < parts.length - 1; i++){ const k = parts[i]; if (typeof o[k] !== "object" || o[k] === null) o[k] = {}; o = o[k]; }
    const last = parts[parts.length - 1];
    if (val === null || val === undefined) delete o[last]; else o[last] = JSON.parse(JSON.stringify(val));
  };
  const notify = () => subs.forEach(s => { const j = JSON.stringify(getAt(s.parts)); if (j !== s.last){ s.last = j; s.cb(JSON.parse(j)); } });
  const commit = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} try { bc && bc.postMessage(1); } catch(e){} notify(); };
  if (bc) bc.onmessage = () => { data = read(); notify(); };
  window.addEventListener("storage", e => { if (e.key === KEY){ data = read(); notify(); } });
  return {
    mode:"demo", now:() => Date.now(), ts:() => Date.now(),
    get: async p => JSON.parse(JSON.stringify(getAt(splitP(p)))),
    set: async (p, v) => { setAt(splitP(p), v); commit(); },
    update: async (p, obj) => { for (const k in obj) setAt(splitP(p + "/" + k), obj[k]); commit(); },
    remove: async p => { setAt(splitP(p), null); commit(); },
    on: (p, cb) => { const s = {parts:splitP(p), cb, last:undefined}; subs.add(s); setTimeout(() => { if (!subs.has(s)) return; s.last = JSON.stringify(getAt(s.parts)); cb(JSON.parse(s.last)); }, 0); return () => subs.delete(s); },
    wipe: async () => { data = {}; commit(); }
  };
}
const TABLE = "juegos";
function makeSupabaseStore(cfg){
  const sb = supabase.createClient(cfg.url.trim(), cfg.anonKey.trim(), {auth:{persistSession:false}});
  let offset = 0, warned = 0;
  sb.rpc("hora_servidor").then(({data}) => { const n = Number(data); if (n > 0) offset = n - Date.now(); });
  const fail = e => {
    console.error(e);
    if (Date.now() - warned < 4000) return; warned = Date.now();
    const m = String(e && (e.message || e.code) || e);
    toast(/relation|does not exist|schema cache|42P01/i.test(m) ? "Falta crear la tabla en Supabase: ejecuta el script SQL de la guía."
      : /permission|policy|row-level|401|403|JWT|apikey|Invalid API key/i.test(m) ? "Supabase rechazó el acceso: revisa la clave anonKey y el script SQL."
      : "No se pudo guardar. Revisa tu conexión a internet.");
  };
  const key = p => splitP(p).join("/");
  const rowOf = (p, value) => { const s = splitP(p); return {path:s.join("/"), sede:s[1] || "", parent:s.slice(0, -1).join("/"), value, updated_at:new Date().toISOString()}; };
  async function fetchRows(k){
    let all = [], from = 0;
    for (;;){
      const {data, error} = await sb.from(TABLE).select("path,value").or(`path.eq.${k},path.like.${k}/*`).order("path").range(from, from + 999);
      if (error){ fail(error); return null; }
      all = all.concat(data || []);
      if (!data || data.length < 1000) return all;
      from += 1000;
    }
  }
  function build(k, entries){
    let root;
    entries.sort((a, b) => a[0].length - b[0].length).forEach(([path, value]) => {
      if (path === k){ root = JSON.parse(JSON.stringify(value)); return; }
      const rel = path.slice(k.length + 1).split("/");
      if (root === undefined || root === null || typeof root !== "object") root = {};
      let o = root;
      for (let i = 0; i < rel.length - 1; i++){ if (typeof o[rel[i]] !== "object" || o[rel[i]] === null) o[rel[i]] = {}; o = o[rel[i]]; }
      o[rel[rel.length - 1]] = JSON.parse(JSON.stringify(value));
    });
    return root === undefined ? null : root;
  }
  const connListeners = new Set(); let connected = null;
  const setConn = v => { if (v !== connected){ connected = v; connListeners.forEach(f => f(v)); } };
  sb.channel("estado").subscribe(st => { if (st === "SUBSCRIBED") setConn(true); else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED") setConn(false); });
  const resyncers = new Set();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") resyncers.forEach(f => f()); });
  window.addEventListener("online", () => resyncers.forEach(f => f()));
  return {
    mode:"online", now:() => Date.now() + offset, ts:() => Date.now() + offset,
    get: async p => { const k = key(p), rows = await fetchRows(k); return rows ? build(k, rows.map(r => [r.path, r.value])) : undefined; },
    set: async (p, v) => {
      if (v === null || v === undefined) return this_remove(p);
      const {error} = await sb.from(TABLE).upsert(rowOf(p, v)); if (error) fail(error);
    },
    update: async (base, obj) => {
      const rows = Object.entries(obj).filter(([, v]) => v !== null && v !== undefined).map(([k, v]) => rowOf(base + "/" + k, v));
      if (rows.length){ const {error} = await sb.from(TABLE).upsert(rows); if (error) fail(error); }
    },
    remove: p => this_remove(p),
    on(p, cb){
      const k = key(p), s = splitP(p), rows = new Map(); let alive = true, timer = null, last, subs = 0;
      const emit = () => { clearTimeout(timer); timer = setTimeout(() => {
        if (!alive) return;
        const v = build(k, [...rows.entries()]), j = JSON.stringify(v);
        if (j !== last){ last = j; cb(JSON.parse(j)); }
      }, 40); };
      const load = async () => { const rs = await fetchRows(k); if (!rs || !alive) return; rows.clear(); rs.forEach(r => rows.set(r.path, r.value)); emit(); };
      const ch = sb.channel("c" + Math.random().toString(36).slice(2));
      const filters = s.length <= 2 ? [`sede=eq.${s[1]}`] : [`path=eq.${k}`, `parent=eq.${k}`];
      filters.forEach(f => ch.on("postgres_changes", {event:"*", schema:"public", table:TABLE, filter:f}, pl => {
        if (pl.eventType === "DELETE"){ if (pl.old && pl.old.path) rows.delete(pl.old.path); }
        else if (pl.new && (pl.new.path === k || pl.new.path.startsWith(k + "/"))) rows.set(pl.new.path, pl.new.value);
        emit();
      }));
      ch.subscribe(st => { if (st === "SUBSCRIBED"){ subs++; load(); } });
      resyncers.add(load);
      return () => { alive = false; clearTimeout(timer); resyncers.delete(load); sb.removeChannel(ch); };
    },
    onConn: f => { connListeners.add(f); if (connected !== null) f(connected); return () => connListeners.delete(f); }
  };
  async function this_remove(p){ const k = key(p); const {error} = await sb.from(TABLE).delete().or(`path.eq.${k},path.like.${k}/*`); if (error) fail(error); }
}

function watchMe(sede, me){
  let done = false, firstCtl = true;
  const kick = () => {
    if (done) return; const cur = getMe(sede); if (!cur || cur.id !== me.id) return;
    done = true; idStore.del("mirage-yo-" + sede);
    toast("Los organizadores reiniciaron los registros. Regístrate de nuevo.");
    if (location.hash.replace(/^#\/?/, "") !== sede) go("#/" + sede); else route();
  };
  Store.get(`sedes/${sede}/players/${me.id}`).then(v => { if (v === null) kick(); });
  track(Store.on(`sedes/${sede}/bajas/${me.id}`, v => { if (v) kick(); }));
  track(Store.on(`sedes/${sede}/control`, () => { if (firstCtl){ firstCtl = false; return; } Store.get(`sedes/${sede}/players/${me.id}`).then(v => { if (v === null) kick(); }); }));
}

/* ---------- Juego (sala de espera → juego → final) ---------- */
function viewGame(sede, gk){
  const me = getMe(sede);
  if (!me){ go("#/" + sede); return; }
  watchMe(sede, me);
  const g = GAMES[gk], base = `sedes/${sede}/games/${gk}`;
  app.innerHTML = `<div class="wrap">
    ${topbar("#/" + sede)}
    <div><div class="eyebrow">${g.brand === "refri" ? "Refrielectric" : "Capacitación Mirage"} · ${esc(CONFIG.sedes[sede].nombre)}</div><h1 class="ptitle" style="font-size:34px">${g.titulo}</h1></div>
    <div id="gbody"></div>
  </div>`;
  const body = document.getElementById("gbody");
  let meta = {status:"cerrado", round:0}, cur = null, ctl = null, lobbyUnsub = null, joinedMe = null;
  const stopLobby = () => { if (lobbyUnsub){ lobbyUnsub(); lobbyUnsub = null; } };
  const stopGame = () => { if (ctl){ ctl.destroy && ctl.destroy(); ctl = null; } };
  track(() => { stopLobby(); stopGame(); });
  let metaLoaded = false, joinLoaded = false;
  const ensureJoined = () => { if (!metaLoaded || !joinLoaded) return; const rd = meta.round || 0; if (meta.status !== "terminado" && (!joinedMe || (joinedMe.round || 0) !== rd)){ joinedMe = {name:me.name, round:rd}; Store.set(`${base}/joined/${me.id}`, {name:me.name, at:Store.ts(), round:rd}); } };
  track(Store.on(`${base}/joined/${me.id}`, v => { joinedMe = v; joinLoaded = true; ensureJoined(); }));
  track(Store.on(`${base}/meta`, m => {
    meta = m || {status:"cerrado", round:0}; metaLoaded = true;
    const mode = meta.status === "jugando" ? "play" : meta.status === "terminado" ? "end" : "lobby";
    const key = mode + ":" + (meta.round || 0) + (mode === "lobby" ? ":" + meta.status : "");
    if (key === cur) return;
    cur = key; ensureJoined();
    if (mode === "lobby"){ stopGame(); renderLobby(); }
    else if (mode === "play"){ stopLobby(); stopGame(); startPlay(); }
    else { stopLobby(); stopGame(); renderEnd(); }

    const open = meta.status === "espera";
    body.innerHTML = `<div class="lobby">

      <div class="banner info small">${g.desc}</div>
      <div class="players" id="pl"></div>
    </div>`;

      const arr = Object.entries(j || {}).filter(([, p]) => p && (p.round || 0) === (meta.round || 0)).sort((a, b) => (a[1].at || 0) - (b[1].at || 0));

      [...pl.children].forEach(c => { if (!ids.has(c.dataset.id)) c.remove(); });
      arr.forEach(([id, p]) => { if (seen.has(id)) return; const s = document.createElement("span"); s.className = "pchip" + (id === me.id ? " me" : ""); s.dataset.id = id; s.textContent = p.name; pl.appendChild(s); });

      <a class="btn btn-ghost" href="#/${sede}">Ver los otros juegos</a></div>`;
  }

    const ctx = {sede, me, base, meta, el:body};
    const fn = {atrapa:atrapaGame, vf:ctx => quizGame(ctx, "vf"), quiz:ctx => quizGame(ctx, "quiz"), ordena:ordenaGame, parejas:parejasGame}[gk];
    const run = () => { if (cur && cur.startsWith("play")) ctl = fn(ctx); };
    const since = Store.now() - (meta.startedAt || 0);
    if (meta.startedAt && since < 3200){

      let n = Math.max(1, 3 - Math.floor(since / 1000));

      tick();
      const iv = setInterval(() => { n--; if (n <= 0){ clearInterval(iv); ov.remove(); run(); } else tick(); }, 1000);
      ctl = {destroy(){ clearInterval(iv); ov.remove(); }};
    } else run();
  }
}

    c.strokeStyle = "#f3f8fc"; c.lineWidth = s*.06; c.beginPath(); c.arc(0, -s*.08, s*.36, 0, 7); c.stroke();

    c.fillStyle = "#f3f8fc"; c.beginPath(); c.arc(0, -s*.08, s*.06, 0, 7); c.fill(); c.fillRect(-s*.04, s*.28, s*.08, s*.16); c.fillRect(-s*.22, s*.42, s*.44, s*.08);
  } else if (type === "fridge"){
    rr(-s*.3, -s*.5, s*.6, s*1.0, s*.08); c.fillStyle = "#e7eef4"; c.fill();
    c.fillStyle = "#b8c8d5"; c.fillRect(-s*.3, -s*.12, s*.6, s*.04);
    c.fillStyle = "#6f8799"; c.fillRect(s*.18, -s*.38, s*.04, s*.18); c.fillRect(s*.18, 0, s*.04, s*.26);

    c.fillStyle = "#c9d8e4"; c.fillRect(-s*.15, s*.16, s*.3, s*.2); c.fillStyle = "#8aa3b6"; c.fillRect(-s*.15, s*.22, s*.3, s*.04); c.fillRect(-s*.15, s*.3, s*.3, s*.04);
    c.strokeStyle = "rgba(255,212,71,.6)"; c.lineWidth = s*.05; for (let i = 0; i < 5; i++){ const a = -2.6 + i*0.55; c.beginPath(); c.moveTo(Math.cos(a)*s*.4, -s*.12 + Math.sin(a)*s*.4); c.lineTo(Math.cos(a)*s*.52, -s*.12 + Math.sin(a)*s*.52); c.stroke(); }
  } else if (type === "solar"){
    c.transform(1, 0, -.25, 1, 0, 0); rr(-s*.5, -s*.32, s*1.0, s*.62, s*.05); c.fillStyle = "#2a6fd0"; c.fill(); c.strokeStyle = "#e7eef4"; c.lineWidth = s*.04; c.stroke();
    c.strokeStyle = "#a9dcff"; c.lineWidth = s*.03; for (let i = 1; i < 4; i++){ c.beginPath(); c.moveTo(-s*.5 + i*s*.25, -s*.32); c.lineTo(-s*.5 + i*s*.25, s*.3); c.stroke(); } c.beginPath(); c.moveTo(-s*.5, 0); c.lineTo(s*.5, 0); c.stroke();
  } else if (type === "snow"){
    c.shadowColor = "#3fb4dc"; c.shadowBlur = s*.4; c.strokeStyle = "#ffffff"; c.lineWidth = s*.08;
    for (let i = 0; i < 3; i++){ c.save(); c.rotate(i*1.047); c.beginPath(); c.moveTo(0, -s*.45); c.lineTo(0, s*.45); c.moveTo(-s*.13, -s*.32); c.lineTo(0, -s*.2); c.lineTo(s*.13, -s*.32); c.moveTo(-s*.13, s*.32); c.lineTo(0, s*.2); c.lineTo(s*.13, s*.32); c.stroke(); c.restore(); }

function drawCart(c, x, y, w, h){

  c.font = `800 ${Math.round(h*.38)}px "Barlow Condensed", Arial, sans-serif`; c.textBaseline = "middle"; c.textAlign = "left";
  const t1 = "REFRI", t2 = "ELECTRIC", w1 = c.measureText(t1).width, w2 = c.measureText(t2).width, x0 = -(w1 + w2) / 2;
  c.fillStyle = "#3fb4dc"; c.fillText(t1, x0, h*.06); c.fillStyle = "#16337a"; c.fillText(t2, x0 + w1, h*.06);
  c.fillStyle = "#0d2259"; c.strokeStyle = "#8fd6f2"; c.lineWidth = 2; [-w*.3, w*.3].forEach(dx => { c.beginPath(); c.arc(dx, h/2 + h*.12, h*.16, 0, 7); c.fill(); c.stroke(); });

}
function atrapaGame(ctx){
  const {el, base, me, meta, sede} = ctx;
  const lk = `mirage-atrapa-${sede}-${me.id}-${meta.round || 0}`;
  const saved = ls.get(lk);
  const showEnd = r => { el.innerHTML = `<div class="lobby"><div class="eyebrow">Tu puntaje</div><div class="score">${r.score}</div>
      <div class="bigmsg">${r.caught} productos atrapados</div>
      <p class="muted" style="margin:0">Tu resultado ya fue enviado. El ganador se anuncia en el auditorio.</p></div>`; };
  if (saved && saved.done){ showEnd(saved); return {destroy(){}}; }
  el.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="pstats"><span>Puntos <span id="as">0</span></span><span id="al" class="hearts">♥♥♥</span><span>⏱ <span id="at">${ATRAPA_SECONDS}</span> s</span></div>
    <div class="stage" id="stage"><canvas id="cv"></canvas>
      <div class="aover" id="aover">
        <div class="bigmsg">¡Surte el carrito!</div>
        <p style="margin:0">Desliza el dedo (o usa las flechas ← →) para mover el carrito Refrielectric. Tienes ${ATRAPA_SECONDS} segundos y 3 vidas.</p>
        <div class="legend">${Object.entries(ITEMS).map(([k, it]) => `<div class="lg"><canvas data-k="${k}" width="88" height="88"></canvas><span><b>${it.hazard ? "Esquiva" : "+" + it.pts}</b> ${esc(it.name)}</span></div>`).join("")}</div>
        <button class="btn btn-cyan btn-xl" id="ago">¡Jugar!</button>
      </div>
    </div>
  </div>`;
  el.querySelectorAll(".legend canvas").forEach(cv => drawItem(cv.getContext("2d"), cv.dataset.k, 44, 44, 64));
  const cv = document.getElementById("cv"), stage = document.getElementById("stage"), c = cv.getContext("2d");
  let W = 0, H = 0;
  const resize = () => { const dpr = Math.min(2, window.devicePixelRatio || 1); W = stage.clientWidth; H = stage.clientHeight; cv.width = W * dpr; cv.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0); };
  resize(); window.addEventListener("resize", resize);
  const S = {running:false, score:0, caught:0, lives:3, t0:0, last:0, items:[], spawnIn:0, px:0.5, tx:0.5, keys:0, pops:[], lastPush:0};
  let raf = 0;
  const goods = Object.keys(ITEMS).filter(k => !ITEMS[k].hazard && k !== "snow");
  function spawn(p){
    let k;
    if (Math.random() < .22 + p*.14) k = Math.random() < .5 ? "bolt" : "drop";
    else if (Math.random() < .07) k = "snow";
    else k = goods[Math.floor(Math.random() * goods.length)];
    const s = Math.max(38, W * .12);
    S.items.push({k, x:s/2 + Math.random() * (W - s), y:-s, s, v:H * (.32 + p*.5) * (.85 + Math.random()*.3), rot:(Math.random() - .5) * .6});
  }
  const push = done => { S.lastPush = performance.now(); return Store.set(`${base}/results/${me.id}`, {name:me.name, round:meta.round || 0, score:S.score, caught:S.caught, lives:S.lives, done:!!done, at:Store.ts()}); };
  function frame(now){
    const dt = Math.min(.05, (now - S.last) / 1000); S.last = now;
    const t = (now - S.t0) / 1000, p = Math.min(1, t / ATRAPA_SECONDS), left = Math.max(0, ATRAPA_SECONDS - t);
    if (S.keys) S.tx = Math.max(0, Math.min(1, S.tx + S.keys * dt * 1.4));
    S.px += (S.tx - S.px) * Math.min(1, dt * 14);
    const cw = Math.max(96, W * .3), ch = Math.max(30, W * .085), cx = cw/2 + S.px * (W - cw), cy = H - ch/2 - 18;
    S.spawnIn -= dt; if (S.spawnIn <= 0){ spawn(p); S.spawnIn = .75 - p * .42; }
    for (const it of S.items){
      it.y += it.v * dt;
      if (!it.hit && it.y + it.s*.3 > cy - ch/2 && it.y - it.s*.3 < cy + ch/2 && Math.abs(it.x - cx) < cw/2 + it.s*.15){
        it.hit = true; const d = ITEMS[it.k];
        if (d.hazard){ S.lives--; S.pops.push({x:it.x, y:cy - ch, txt:"¡" + d.name + "!", col:"#ff7a70", t:0}); stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake"); try { navigator.vibrate && navigator.vibrate(120); } catch(e){} }
        else { S.score += d.pts; S.caught++; S.pops.push({x:it.x, y:cy - ch, txt:"+" + d.pts + " " + d.name, col:it.k === "snow" ? "#8fd6f2" : "#7be0b4", t:0}); }
      }
    }
    S.items = S.items.filter(it => !it.hit && it.y - it.s < H);
    c.clearRect(0, 0, W, H);
    for (const it of S.items){ c.save(); c.translate(it.x, it.y); c.rotate(it.rot); drawItem(c, it.k, 0, 0, it.s); c.restore(); }
    drawCart(c, cx, cy, cw, ch);
    c.textAlign = "center"; c.textBaseline = "alphabetic"; c.font = `800 ${Math.round(Math.max(16, W*.045))}px "Barlow Condensed", Arial, sans-serif`;
    S.pops = S.pops.filter(pp => (pp.t += dt) < 1);
    for (const pp of S.pops){ c.globalAlpha = 1 - pp.t; c.fillStyle = pp.col; c.fillText(pp.txt, Math.max(60, Math.min(W - 60, pp.x)), pp.y - pp.t * 50); }
    c.globalAlpha = 1;

    document.getElementById("at").textContent = Math.ceil(left);
    document.getElementById("al").textContent = "♥".repeat(Math.max(0, S.lives)) + "♡".repeat(3 - Math.max(0, S.lives));

    if (left <= 0 || S.lives <= 0) return end();
    raf = requestAnimationFrame(frame);
  }
  function end(){
    S.running = false;
    const r = {score:S.score, caught:S.caught, done:true}; ls.set(lk, r); push(true);
    const ov = document.getElementById("aover");
    ov.innerHTML = `<div class="bigmsg">${S.lives <= 0 ? "¡Sin vidas!" : "¡Tiempo!"}</div><div class="score">${S.score}</div><p style="margin:0">Atrapaste ${S.caught} productos.</p>`;
    ov.hidden = false;
    setTimeout(() => { if (document.body.contains(el)) showEnd(r); }, 2600);
  }
  document.getElementById("ago").onclick = () => { document.getElementById("aover").hidden = true; resize(); S.running = true; S.t0 = S.last = performance.now(); push(false); raf = requestAnimationFrame(frame); };
  const setX = e => { const r = cv.getBoundingClientRect(); S.tx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
  cv.addEventListener("pointerdown", e => { setX(e); try { cv.setPointerCapture(e.pointerId); } catch(_){} });
  cv.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || e.buttons || e.pressure > 0) setX(e); });

  return {destroy(){ cancelAnimationFrame(raf); window.removeEventListener("resize", resize); window.removeEventListener("keydown", kd); window.removeEventListener("keyup", ku); if (S.running) push(false); }};
}

/* ---------- REFRIELECTRIC 2 (V o F) y MIRAGE 1 (Quiz): motor de preguntas ---------- */
function quizGame(ctx, kind){
  const {el, base, me, meta, sede} = ctx;
  const isVF = kind === "vf";
  const Q = isVF ? VF : QUIZ, SECS = isVF ? VF_SECONDS : QUIZ_SECONDS, LIMIT = SECS * 1000;
  const lk = `mirage-${kind}-${sede}-${me.id}-${meta.round || 0}`;
  let st = ls.get(lk) || {idx:0, score:0, correct:0, timeMs:0, qStart:null, phase:"q", last:null};
  let iv = null;
  const save = () => ls.set(lk, st);
  const push = done => Store.set(`${base}/results/${me.id}`, {name:me.name, round:meta.round || 0, score:st.score, correct:st.correct, answered:st.idx + (st.phase === "fb" ? 1 : 0), timeMs:st.timeMs, done:!!done, at:Store.ts()});
  function show(){
    clearInterval(iv);
    if (st.idx >= Q.length) return finish();
    if (st.phase === "fb") return feedback();
    if (!st.qStart){ st.qStart = Date.now(); save(); }
    const q = Q[st.idx];
    const opts = isVF
      ? `<div class="vfopts"><button class="opt c3" data-i="0">Verdadero</button><button class="opt c0" data-i="1">Falso</button></div>`
      : `<div class="opts">${q.o.map((o, i) => `<button class="opt c${i}" data-i="${i}"><b>${"ABCD"[i]}</b><span>${esc(o)}</span></button>`).join("")}</div>`;
    el.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
      <div class="qtop"><span class="n">${isVF ? "Afirmación" : "Pregunta"} ${st.idx + 1}/${Q.length}</span><span id="qs">${SECS} s</span></div>
      <div class="timer" id="tm"><i id="tb"></i></div>
      ${q.t ? `<span class="ttag">${esc(q.t)}</span>` : ""}
      <div class="qtext">${esc(q.q)}</div>
      ${opts}
    </div>`;
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
    const upd = () => {
      const left = Math.max(0, LIMIT - (Date.now() - st.qStart));
      const tb = document.getElementById("tb"); if (!tb) return;
      tb.style.transform = `scaleX(${left / LIMIT})`;
      document.getElementById("qs").textContent = Math.ceil(left / 1000) + " s";
      document.getElementById("tm").classList.toggle("low", left < LIMIT * .25);
      if (left <= 0) answer(-1);
    };
    upd(); iv = setInterval(upd, 100);
  }
  function answer(i){
    if (st.phase !== "q") return;
    clearInterval(iv);
    const q = Q[st.idx], used = Math.min(LIMIT, Date.now() - st.qStart), ok = i === q.a;
    const pts = ok ? Math.round(500 + 500 * (1 - used / LIMIT)) : 0;
    st.score += pts; st.correct += ok ? 1 : 0; st.timeMs += used; st.last = {i, ok, pts}; st.phase = "fb";
    save(); push(false); feedback();
  }
  function feedback(){
    const q = Q[st.idx], L = st.last || {};
    const ans = isVF ? (q.a === 0 ? "Verdadero" : "Falso") : q.o[q.a];
    el.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
      <div class="fb ${L.ok ? "ok" : "bad"}"><h3>${L.ok ? "¡Correcto! +" + L.pts : L.i === -1 ? "Se acabó el tiempo" : "Incorrecto"}</h3>
        <div><b>Respuesta:</b> ${esc(ans)}</div><div class="muted">${esc(q.e)}</div></div>
      <button class="btn btn-main btn-xl" id="nx">${st.idx + 1 >= Q.length ? "Ver mi resultado" : "Siguiente"}</button>
    </div>`;
    document.getElementById("nx").onclick = () => { st.idx++; st.qStart = null; st.phase = "q"; save(); show(); };
  }
  function finish(){
    if (!st.sent){ st.sent = true; save(); push(true); }
    el.innerHTML = `<div class="lobby"><div class="eyebrow">Tu resultado</div><div class="score">${st.score}</div>
      <div class="bigmsg">${st.correct} de ${Q.length} correctas</div>
      <p class="muted" style="margin:0">Tu resultado ya fue enviado. El ganador se anuncia en el auditorio.</p></div>`;
  }
  show();
  return {destroy(){ clearInterval(iv); }};
}

/* ---------- MIRAGE 2: Ordena el Proceso ---------- */
function ordenaGame(ctx){
  const {el, base, me, meta, sede} = ctx;
  const lk = `mirage-ordena-${sede}-${me.id}-${meta.round || 0}`;
  let st = ls.get(lk);
  if (!st){ st = {r:0, placed:0, errors:0, start:Date.now(), done:false, timeMs:null, order:ORDENA.map(o => shuffle([...o.steps.keys()]))}; ls.set(lk, st); }
  let iv = null, lock = false;
  const elapsed = () => st.done ? st.timeMs : Date.now() - st.start;
  const push = () => Store.set(`${base}/results/${me.id}`, {name:me.name, round:meta.round || 0, timeMs:elapsed(), errors:st.errors, rounds:st.r + (st.done ? 0 : 0), total:elapsed() + st.errors * ORDENA_PENALTY, done:st.done, at:Store.ts()});
  function render(){
    clearInterval(iv);
    if (st.done) return finish();
    const R = ORDENA[st.r];
    el.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
      <div class="pstats"><span>Ronda ${st.r + 1}/${ORDENA.length}</span><span>Errores <span id="oe">${st.errors}</span></span><span>⏱ <span id="ot">0.0 s</span></span></div>
      <span class="ttag">${esc(R.t)}</span>
      <h2 style="font-size:26px;text-transform:uppercase;line-height:1.05">${esc(R.titulo)}</h2>
      <p class="muted small" style="margin:0">Toca los pasos en el orden correcto, del primero al último. Cada error suma 5 segundos.</p>
      <div class="slots">${R.steps.map((s, i) => `<div class="slot${i < st.placed ? " full" : ""}" id="sl${i}"><b>${i + 1}</b><span>${i < st.placed ? esc(s) : ""}</span></div>`).join("")}</div>
      <div class="steps">${st.order[st.r].filter(i => i >= st.placed).map(i => `<button class="step" data-i="${i}">${esc(R.steps[i])}</button>`).join("")}</div>
    </div>`;
    const ot = document.getElementById("ot");
    iv = setInterval(() => ot.textContent = fmtMs(elapsed()), 100);
    el.querySelectorAll(".step").forEach(b => b.onclick = () => tap(+b.dataset.i, b));
  }
  function tap(i, b){
    if (lock) return;
    const R = ORDENA[st.r];
    if (i === st.placed){
      const sl = document.getElementById("sl" + i); sl.classList.add("full"); sl.querySelector("span").textContent = R.steps[i];
      b.remove(); st.placed++;
      if (st.placed >= R.steps.length){
        st.r++; st.placed = 0;
        if (st.r >= ORDENA.length){ st.done = true; st.timeMs = Date.now() - st.start; }
        ls.set(lk, st); push();
        lock = true;
        el.querySelector(".steps").innerHTML = `<div class="banner info">${st.done ? "¡Completaste todos los procesos!" : "¡Proceso correcto! Siguiente ronda…"}</div>`;
        setTimeout(() => { lock = false; render(); }, 1100);
      } else ls.set(lk, st);
    } else {
      st.errors++; ls.set(lk, st); document.getElementById("oe").textContent = st.errors;
      b.classList.remove("no"); void b.offsetWidth; b.classList.add("no");
      try { navigator.vibrate && navigator.vibrate(80); } catch(e){}
    }
  }
  function finish(){
    clearInterval(iv);
    el.innerHTML = `<div class="lobby"><div class="eyebrow">Tu tiempo total</div><div class="score">${fmtMs(st.timeMs + st.errors * ORDENA_PENALTY)}</div>
      <div class="bigmsg">${st.errors} ${st.errors === 1 ? "error" : "errores"}</div>
      <p class="muted" style="margin:0">Tiempo ${fmtMs(st.timeMs)} + ${st.errors} × 5 s de penalización. Tu resultado fue enviado; el ganador se anuncia en el auditorio.</p></div>`;
  }
  push(); render();
  return {destroy(){ clearInterval(iv); }};
}

/* ---------- MIRAGE 3: Reto de Parejas ---------- */
function parejasGame(ctx){
  const {el, base, me, meta, sede} = ctx;
  const lk = `mirage-parejas-${sede}-${me.id}-${meta.round || 0}`;
  let st = ls.get(lk);
  if (!st){ st = {deck:shuffle(PAIRS.flatMap((p, i) => [{p:i, k:"c"}, {p:i, k:"d"}])), matched:[], moves:0, start:Date.now(), done:false, timeMs:null}; ls.set(lk, st); }
  let open = [], lock = false, iv = null;
  const matched = new Set(st.matched);
  function finish(){
    clearInterval(iv);
    el.innerHTML = `<div class="lobby"><div class="eyebrow">Tu tiempo</div><div class="score">${fmtMs(st.timeMs)}</div>
      <div class="bigmsg">${st.moves} jugadas</div>
      <p class="muted" style="margin:0">¡Completaste el reto! Tu resultado fue enviado. El ganador se anuncia en el auditorio.</p></div>`;
  }
  if (st.done){ finish(); return {destroy(){}}; }
  el.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
    <div class="pstats"><span>⏱ <span id="pt">0.0 s</span></span><span>Parejas <span id="pm">${matched.size}</span>/${PAIRS.length}</span><span>Jugadas <span id="pv">${st.moves}</span></span></div>
    <div class="pgrid">${st.deck.map((c, i) => `<button class="pc${matched.has(c.p) ? " done" : ""}" data-i="${i}" aria-label="Carta ${i + 1}"><span class="in"><span class="bk"><i>M</i></span><span class="fa ${c.k}">${esc(PAIRS[c.p][c.k === "c" ? 0 : 1])}</span></span></button>`).join("")}</div>
    <p class="muted small" style="margin:0">Las cartas blancas son conceptos y las azules son datos. Une cada concepto con su dato correcto.</p>
  </div>`;
  const pt = document.getElementById("pt");
  iv = setInterval(() => { pt.textContent = fmtMs(Date.now() - st.start); }, 100);
  el.querySelectorAll(".pc").forEach(b => b.onclick = () => flip(+b.dataset.i, b));
  function flip(i, b){
    const c = st.deck[i];
    if (lock || matched.has(c.p) || open.some(o => o.i === i)) return;
    b.classList.add("open"); open.push({i, b, c});
    if (open.length < 2) return;
    st.moves++; document.getElementById("pv").textContent = st.moves;
    const [a, z] = open;
    if (a.c.p === z.c.p){
      matched.add(a.c.p); st.matched = [...matched]; a.b.classList.add("done"); z.b.classList.add("done"); open = [];
      document.getElementById("pm").textContent = matched.size;
      if (matched.size === PAIRS.length){ st.done = true; st.timeMs = Date.now() - st.start; ls.set(lk, st); clearInterval(iv);
        Store.set(`${base}/results/${me.id}`, {name:me.name, round:meta.round || 0, timeMs:st.timeMs, moves:st.moves, matched:matched.size, done:true, at:Store.ts()});
        setTimeout(finish, 700); return; }
      ls.set(lk, st);
      Store.set(`${base}/results/${me.id}`, {name:me.name, round:meta.round || 0, timeMs:Date.now() - st.start, moves:st.moves, matched:matched.size, done:false, at:Store.ts()});
    } else {
      lock = true; ls.set(lk, st);
      setTimeout(() => { a.b.classList.remove("open"); z.b.classList.remove("open"); open = []; lock = false; }, 850);
    }
  }
  return {destroy(){ clearInterval(iv); }};
}

function simulateBots(gk, joined, rd){
  if (Store.mode !== "demo") return;

      else if (gk === "quiz" || gk === "vf"){ const n = gk === "quiz" ? QUIZ.length : VF.length, correct = Math.floor(rnd(n * .4, n + 1)); r = {score:correct * Math.floor(rnd(600, 950)), correct, answered:n, timeMs:n * rnd(3000, 9000)}; }
      else if (gk === "ordena"){ const t = rnd(35000, 110000), e = Math.floor(rnd(0, 7)); r = {timeMs:t, errors:e, total:t + e * ORDENA_PENALTY}; }
      else r = {timeMs:rnd(25000, 85000), moves:Math.floor(rnd(8, 22)), matched:PAIRS.length};
      Store.set(`${base}/results/${id}`, {name:p.name, ...r, round:rd, done:true, at:Store.ts()});

        b.disabled = (a === "espera" && st !== "cerrado") || (a === "jugando" && !(st === "espera" || st === "cerrado")) || (a === "terminado" && st !== "jugando");
      });
      panel.querySelector("#ghint").textContent = {cerrado:"1) Abre la sala para que los asistentes esperen en su celular.", espera:"2) Cuando estén todos en la sala, toca Iniciar juego. Verán una cuenta regresiva de 3 segundos.", jugando:"3) Los jugadores están jugando. La clasificación se actualiza en vivo.", terminado:"Juego cerrado. Usa Reiniciar solo si quieres repetirlo desde cero."}[st];
      const joined = Object.entries(G.joined || {}).sort((a, b) => (a[1].at || 0) - (b[1].at || 0));
      panel.querySelector("#gjn").textContent = joined.length;
      panel.querySelector("#gjl").innerHTML = joined.length ? joined.map(([, p]) => `<span class="pchip">${esc(p.name)}</span>`).join("") : `<span class="muted small">Nadie en la sala todavía.</span>`;
      const results = Object.values(G.results || {}), R = ranking(), done = results.filter(r => r.done).length;
      panel.querySelector("#gst").innerHTML = `<div class="stat"><b>${joined.length}</b><span>En la sala</span></div><div class="stat"><b>${results.length}</b><span>Jugando</span></div><div class="stat"><b>${done}</b><span>Terminaron</span></div>`;
      const top = (gk === "parejas" || gk === "ordena") ? R.find(([, r]) => r.done) : R[0];
      panel.querySelector("#gwin").innerHTML = top ? `<div class="winner"><span class="k">${st === "terminado" ? "Ganador" : "Va ganando"} · solo visible aquí</span><span class="n">${esc(top[1].name)}</span><span>Cel. ${esc(phoneOf(top[0]))} · ${COLS.w(top[1])}</span></div>` : "";
      panel.querySelector("#grank").innerHTML = R.length
        ? `<table><thead><tr><th>#</th><th>Jugador</th>${COLS.h.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${R.map(([id, r], i) => `<tr class="${top && id === top[0] ? "win" : ""}"><td>${i + 1}</td><td>${esc(r.name)}</td>${COLS.r(r).map(v => `<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table>`
        : `<div class="empty">La clasificación aparece en cuanto los jugadores empiecen a jugar.</div>`;
    },
    destroy(){ panel.removeEventListener("click", onClick); }
  };
}

/* ---- Sorteo ---- */
function panelSorteo(panel){
  let D = {}, spinning = false;
  panel.innerHTML = `<div class="agrid">
    <div class="card">
      <div><div class="eyebrow">Souvenirs</div><h2 style="font-size:30px;text-transform:uppercase">Sorteo entre registrados</h2></div>
      <div class="reel" id="reel"><b>¿Quién gana?</b></div>
      <label class="check"><input type="checkbox" id="excl" checked> No repetir ganadores anteriores</label>
      <button class="btn btn-main btn-xl" id="spin">Girar</button>
      <p class="muted small" style="margin:0" id="sinfo"></p>
    </div>
    <div class="card"><h3 style="font-size:22px;text-transform:uppercase">Ganadores del sorteo</h3><div class="tblwrap" id="sh"></div></div>
  </div>`;
  const pool = () => {
    const prev = new Set(Object.values(D.sorteo || {}).map(s => s.pid));
    return Object.entries(D.players || {}).filter(([id]) => !(panel.querySelector("#excl").checked && prev.has(id)));
  };
  panel.querySelector("#spin").onclick = () => {
    if (spinning) return;
    const P = pool(); if (!P.length) return toast("No hay participantes disponibles para el sorteo");
    spinning = true; const reel = panel.querySelector("#reel"); reel.classList.remove("done");
    const win = P[Math.floor(Math.random() * P.length)]; let n = 0, delay = 50;
    const step = () => {
      n++; reel.innerHTML = `<b>${esc(P[Math.floor(Math.random() * P.length)][1].name)}</b>`;
      if (n < 28){ delay *= 1.09; setTimeout(step, delay); }
      else { reel.innerHTML = `<b>${esc(win[1].name)}</b>`; reel.classList.add("done"); spinning = false;
        Store.set(`sedes/${adm.sede}/sorteo/${uid("s")}`, {pid:win[0], name:win[1].name, phone:win[1].phone, at:Store.ts()}); }
    };
    step();
  };
  panel.querySelector("#excl").onchange = () => panel.querySelector("#sinfo").textContent = `${pool().length} participantes en la tómbola.`;
  return {update(d){
    D = d;
    panel.querySelector("#sinfo").textContent = `${pool().length} participantes en la tómbola.`;
    const H = Object.values(d.sorteo || {}).sort((a, b) => (b.at || 0) - (a.at || 0));
    panel.querySelector("#sh").innerHTML = H.length ? `<table><thead><tr><th>Hora</th><th>Ganador</th><th>Celular</th></tr></thead><tbody>${H.map(s => `<tr><td>${fmtHora(s.at)}</td><td>${esc(s.name)}</td><td>${esc(s.phone)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">Aún no hay sorteos en ${esc(sedeName())}.</div>`;
  }};
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
function setupScreen(title, msg){
  app.innerHTML = `<div class="wrap"><div class="topbar"><div class="tb-left"><img class="logo-r" src="${LOGO_REFRI}" alt="Refrielectric"></div>${guestHTML()}</div>
    <div class="card"><div class="eyebrow">Configuración pendiente</div><h1 class="ptitle" style="font-size:30px">${title}</h1><p style="margin:0">${msg}</p></div></div>`;
}
(async function boot(){
  const cfg = CONFIG.supabase || {};
  const demo = /[?&]demo=1/.test(location.search);
  if (demo){ Store = makeLocalStore(); }
  else if (!cfg.url || !cfg.anonKey){
    Store = {mode:"online"};
    return setupScreen("Falta conectar Supabase", "Abre este archivo, busca <b>PEGA AQUÍ LOS DATOS DE SUPABASE</b> al inicio y completa <b>url</b> y <b>anonKey</b>. Luego vuelve a subirlo a GitHub.");
  } else {
    try {
      await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js");
      Store = makeSupabaseStore(cfg);
    } catch(e){
      console.error(e); Store = {mode:"online"};
      return setupScreen("No se pudo conectar", "No se pudo cargar Supabase o los datos de configuración tienen un error. Revisa tu conexión a internet y que <b>url</b> y <b>anonKey</b> estén bien copiados.<br><span class='muted small'>" + esc(e && e.message || "") + "</span>");
    }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
